<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="#fff"/><rect x="0" y="0" width="67" height="600" rx="0" fill="#075c3f"/><text x="23" y="40" font-family="Arial,sans-serif" font-size="24" fill="#fff" font-weight="700">S</text><rect x="22" y="100" width="23" height="23" rx="6" fill="#9ed9b8"/><rect x="22" y="149" width="23" height="23" rx="6" fill="#9ed9b8"/><rect x="22" y="198" width="23" height="23" rx="6" fill="#9ed9b8"/><rect x="22" y="247" width="23" height="23" rx="6" fill="#9ed9b8"/><rect x="67" y="0" width="258" height="600" rx="0" fill="#f4f7f2"/><text x="88" y="38" font-family="Arial,sans-serif" font-size="17" fill="#233e32" font-weight="600">Support / concept</text><text x="88" y="95" font-family="Arial,sans-serif" font-size="24" fill="#233e32" font-weight="600">Conversations</text><rect x="88" y="119" width="215" height="34" rx="6" fill="#e4ece3"/><text x="101" y="140" font-family="Arial,sans-serif" font-size="11" fill="#64766b" font-weight="400">Search conversations</text><rect x="79" y="165" width="232" height="73" rx="8" fill="#e0efdf"/><text x="93" y="187" font-family="Arial,sans-serif" font-size="12" fill="#233e32" font-weight="600">Product question</text><text x="93" y="211" font-family="Arial,sans-serif" font-size="11" fill="#64766b" font-weight="400">Can you help me choose?</text><text x="93" y="270" font-family="Arial,sans-serif" font-size="12" fill="#233e32" font-weight="600">Order update</text><text x="93" y="294" font-family="Arial,sans-serif" font-size="11" fill="#64766b" font-weight="400">Where can I see my order?</text><text x="93" y="353" font-family="Arial,sans-serif" font-size="12" fill="#233e32" font-weight="600">Team handoff</text><text x="93" y="377" font-family="Arial,sans-serif" font-size="11" fill="#64766b" font-weight="400">A question for your team</text><text x="93" y="436" font-family="Arial,sans-serif" font-size="12" fill="#233e32" font-weight="600">Delivery question</text><text x="93" y="460" font-family="Arial,sans-serif" font-size="11" fill="#64766b" font-weight="400">What happens after dispatch?</text><text x="353" y="39" font-family="Arial,sans-serif" font-size="16" fill="#233e32" font-weight="600">Product question</text><text x="771" y="39" font-family="Arial,sans-serif" font-size="11" fill="#233e32" font-weight="400">Assigned to support</text><rect x="346" y="63" width="590" height="1" rx="0" fill="#e5ede7"/><text x="547" y="111" font-family="Arial,sans-serif" font-size="11" fill="#64766b" font-weight="400">Example conversation</text><rect x="488" y="149" width="422" height="62" rx="12" fill="#edf5ef"/><text x="509" y="175" font-family="Arial,sans-serif" font-size="14" fill="#233e32" font-weight="400">Hi! I’m looking for an everyday bag.</text><text x="509" y="196" font-family="Arial,sans-serif" font-size="14" fill="#233e32" font-weight="400">Could you help me find the right one?</text><rect x="361" y="240" width="429" height="93" rx="12" fill="#075c3f"/><text x="382" y="269" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="400">Of course. What would you like to carry?</text><text x="382" y="294" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="400">I can help with the collection, or bring</text><text x="382" y="317" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="400">someone from the team into the conversation.</text><rect x="695" y="366" width="215" height="53" rx="12" fill="#edf5ef"/><text x="718" y="397" font-family="Arial,sans-serif" font-size="14" fill="#233e32" font-weight="400">Just the everyday essentials.</text><rect x="362" y="453" width="301" height="36" rx="18" fill="#e5f1e8"/><text x="380" y="476" font-family="Arial,sans-serif" font-size="12" fill="#233e32" font-weight="400">View collection    /    Talk to the team</text><rect x="350" y="523" width="580" height="55" rx="10" fill="#f4f7f2"/><text x="371" y="555" font-family="Arial,sans-serif" font-size="13" fill="#64766b" font-weight="400">Write a reply…</text><rect x="883" y="535" width="31" height="31" rx="16" fill="#075c3f"/><text x="892" y="556" font-family="Arial,sans-serif" font-size="18" fill="#fff" font-weight="400">↑</text></svg>